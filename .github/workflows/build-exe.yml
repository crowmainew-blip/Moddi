name: build moddi.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้งเครื่องมือ
        run: pip install pyinstaller UnityPy TypeTreeGeneratorAPI

      - name: สร้างหน้าเว็บแล้วใส่ลงแอป
        shell: bash
        run: |
          python web/build.py
          mkdir -p app/site
          cp web/site/index.html web/site/catalog.json app/site/
          cp -r web/site/mods app/site/

      - name: build moddi.exe
        run: pyinstaller --noconfirm moddi.spec

      - name: ทดสอบ exe
        run: dist\moddi.exe --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: moddi-exe
          path: dist/moddi.exe

      # push tag เช่น v0.1.0 → สร้างหน้า Release ให้โหลด (ลิงก์ .../releases/latest/download/moddi.exe)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/moddi.exe
          generate_release_notes: true
