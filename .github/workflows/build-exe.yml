name: build moddi.exe

# ไม่ build เองตอน push แล้ว กด Run workflow ใน Actions เองเท่านั้น (กัน release ถี่)
on:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้งเครื่องมือ
        run: pip install pyinstaller UnityPy TypeTreeGeneratorAPI

      - name: สร้างหน้าเว็บแล้วใส่ลงแอป
        shell: bash
        run: |
          python web/build.py
          mkdir -p app/site
          cp web/site/index.html web/site/catalog.json app/site/
          cp -r web/site/mods app/site/
          V=$(tr -d '[:space:]' < app/VERSION)
          echo "{\"version\": \"$V\", \"build\": ${{ github.run_number }}}" > app/build.json
          cp app/build.json latest.json

      - name: build moddi.exe
        run: pyinstaller --noconfirm moddi.spec

      - name: ทดสอบ exe
        run: dist\moddi.exe --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: moddi-exe
          path: dist/moddi.exe

      # เลขเวอร์ชันอยู่ใน app/VERSION · push ขึ้น main = อัปเดตไฟล์ใน Release ของเวอร์ชันนั้น
      # เปลี่ยนเลขใน VERSION = ได้ Release ใหม่ (ลิงก์ .../releases/latest/download/moddi.exe ชี้ตัวล่าสุดเสมอ)
      - name: อ่านเวอร์ชัน
        id: ver
        shell: bash
        run: echo "v=$(tr -d '[:space:]' < app/VERSION)" >> "$GITHUB_OUTPUT"

      - name: เตรียม repo moddi-releases (ต้องมีอย่างน้อย 1 ไฟล์)
        if: ${{ env.RELEASES_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh api repos/crowmainew-blip/moddi-releases/contents/README.md >/dev/null 2>&1 || \
          gh api -X PUT repos/crowmainew-blip/moddi-releases/contents/README.md \
            -f message="moddi releases" \
            -f content="$(printf '# moddi\n\nดาวน์โหลด moddi.exe ได้ที่หน้า Releases · https://moddith.vercel.app\n' | base64 -w0)"

      # repo โค้ดเป็น Private → ปล่อยไฟล์ให้คนโหลดที่ repo สาธารณะ moddi-releases
      - name: Release (moddi-releases)
        if: ${{ env.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: crowmainew-blip/moddi-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.ver.outputs.v }}
          name: moddi v${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            dist/moddi.exe
            latest.json
          body: |
            โหลด moddi.exe แล้วดับเบิลคลิกได้เลย ไม่ต้องลง Python
            ครั้งแรก Windows อาจเตือน "Windows protected your PC" ให้กด More info → Run anyway

      - name: Release (repo นี้)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: moddi v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/moddi.exe
            latest.json
          body: |
            โหลด moddi.exe แล้วดับเบิลคลิกได้เลย ไม่ต้องลง Python
            ครั้งแรก Windows อาจเตือน "Windows protected your PC" ให้กด More info → Run anyway
