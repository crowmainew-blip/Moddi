<title>moddi — คลังเกมแปลไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Warm dark ramp — the night-time RPG dialogue window */
  :root {
    --deep:#12110f; --bg:#161513; --card:#1c1a18; --raised:#262421;
    --line:rgba(239,233,222,.08); --line2:rgba(239,233,222,.14);
    --t1:#efe9de; --t2:#aaa398; --t3:#8a847a;
    --acc:#9474e6; --acc-text:#b8a2f2;
    --pos:#4cc38a; --neg:#e5484d;
    --ease:cubic-bezier(.22,1,.36,1);
    --sans:"IBM Plex Sans Thai","Sarabun","Leelawadee UI",Tahoma,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--t1); font:400 15px/1.6 var(--sans); }
  a { color:inherit; }
  .ic { width:16px; height:16px; flex:none; }
  /* กันข้อความยาวๆ ดันหน้าจอให้กว้างเกิน */
  main, .page, .studio, .panel, .stat, .need, .gp > *, .acct > *, .mod, .note, .srcrow, .rf, .rf .card { min-width:0; }
  .panel, .stat, .note, .srcrow, .ed td, .rf .src, .rf .cur, .dlg, .kv dd { overflow-wrap:anywhere; word-break:break-word; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .t2 { color:var(--t2); } .t3 { color:var(--t3); }
  .hide { display:none !important; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; border-radius:6px; }

  /* nav */
  header.top { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  .top .in { max-width:1200px; margin:0 auto; height:56px; padding:0 24px; display:flex; align-items:center; gap:32px; }
  .brand { font-weight:600; font-size:17px; text-decoration:none; letter-spacing:0; display:flex; align-items:center; gap:8px; }
  .brand img { width:28px; height:28px; border-radius:7px; display:block; }
  .links { display:flex; gap:4px; flex:1; }
  .links a { text-decoration:none; color:var(--t2); padding:6px 12px; border-radius:8px; font-size:14px; transition:color .15s var(--ease), background-color .15s var(--ease); }
  .links a:hover { color:var(--t1); }
  .links a.on { color:var(--t1); background:var(--raised); }
  .auth { display:flex; align-items:center; gap:8px; font-size:14px; }
  .linkbtn { background:none; border:0; color:var(--t2); font:inherit; font-size:14px; cursor:pointer; padding:6px 8px; border-radius:8px; display:inline-flex; gap:8px; align-items:center; transition:color .15s var(--ease); }
  .linkbtn:hover { color:var(--t1); }
  .avatar { width:28px; height:28px; border-radius:50%; background:var(--raised); border:1px solid var(--line2); display:grid; place-items:center; font-size:12px; font-weight:500; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .menubtn { display:none; }

  main { max-width:1200px; margin:0 auto; padding:0 24px 96px; }
  section.page { animation:enter .4s var(--ease) both; }
  @keyframes enter { from { opacity:0; transform:translateY(8px); } }

  /* buttons and fields */
  .btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-radius:8px; font:500 14px/1 var(--sans); cursor:pointer; text-decoration:none; border:1px solid transparent; transition:background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .12s var(--ease); white-space:nowrap; }
  .btn:active { transform:scale(.98); }
  .btn.pri { background:var(--t1); color:var(--bg); box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
  .btn.pri:hover { background:#fff; }
  .btn.sec { background:var(--raised); color:var(--t1); border-color:var(--line); }
  .btn.sec:hover { border-color:var(--line2); }
  .btn.quiet { background:none; color:var(--t2); padding:0 8px; }
  .btn.quiet:hover { color:var(--t1); }
  .btn.danger { background:none; color:#f0a1a3; border-color:rgba(229,72,77,.35); }
  .btn:disabled { opacity:.4; cursor:default; transform:none; }
  .btn.lg { height:48px; padding:0 20px; font-size:15px; }
  input[type=text], input[type=search], input[type=password], select, textarea {
    background:var(--deep); color:var(--t1); border:1px solid var(--line2); border-radius:8px; height:40px; padding:0 12px; font:400 14px var(--sans); width:100%; transition:border-color .15s var(--ease);
  }
  textarea { height:auto; padding:8px 12px; line-height:1.6; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc); }
  label.f { display:grid; gap:8px; font-size:13px; color:var(--t2); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  /* hero */
  .hero { display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center; padding:96px 0 80px; }
  .hero h1 { font-size:44px; line-height:1.25; font-weight:500; margin:0 0 16px; letter-spacing:-.01em; }
  .hero p.sub { font-size:18px; line-height:1.7; color:var(--t2); margin:0 0 32px; max-width:34rem; }
  .searchbox { position:relative; max-width:30rem; }
  .searchbox .ic { position:absolute; left:16px; top:16px; color:var(--t3); }
  .searchbox input { height:48px; padding-left:44px; font-size:15px; }
  .hero .more { margin-top:16px; font-size:14px; }

  /* the moment: dialogue window */
  .dlg { background:var(--deep); border:1px solid var(--line2); border-radius:16px; padding:24px; position:relative; box-shadow:0 24px 48px rgba(0,0,0,.35); }
  .dlg .who { display:inline-block; font-size:13px; color:var(--acc-text); margin-bottom:12px; }
  .dlg .src { font-family:var(--mono); font-size:13px; line-height:1.7; color:var(--t3); margin:0 0 12px; padding-bottom:12px; border-bottom:1px dashed var(--line2); }
  .dlg .dst { font-size:22px; line-height:1.6; margin:0; }
  .dlg .foot { display:flex; justify-content:space-between; align-items:center; margin-top:24px; font-size:12px; color:var(--t3); }
  .tri { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid var(--acc); display:inline-block; }
  .dlg-wrap { position:relative; }
  .dlg-wrap .ghost { position:absolute; inset:24px -16px -16px 24px; border:1px solid var(--line); border-radius:16px; background:var(--card); z-index:-1; }

  /* catalog */
  .sechead { display:flex; align-items:end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:0 0 24px; }
  .sechead h2 { font-size:24px; font-weight:500; margin:0; line-height:1.3; }
  .sechead .count { font-size:13px; color:var(--t3); margin-left:8px; }
  .seg { display:inline-flex; background:var(--deep); border:1px solid var(--line); border-radius:10px; padding:4px; gap:4px; }
  .seg button { background:none; border:0; color:var(--t2); font:400 13px var(--sans); height:28px; padding:0 12px; border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:color .15s var(--ease), background-color .15s var(--ease); }
  .seg button.on { background:var(--raised); color:var(--t1); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
  .toggle { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--t2); cursor:pointer; user-select:none; }
  .toggle .sw { width:28px; height:16px; border-radius:8px; background:var(--raised); border:1px solid var(--line2); position:relative; transition:background-color .15s var(--ease); }
  .toggle .sw::after { content:""; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:var(--t3); transition:transform .15s var(--ease), background-color .15s var(--ease); }
  .toggle.on .sw { background:rgba(148,116,230,.3); } .toggle.on .sw::after { transform:translateX(12px); background:var(--acc); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .game { display:flex; flex-direction:column; gap:12px; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; text-decoration:none; transition:border-color .15s var(--ease), background-color .15s var(--ease); min-height:148px; }
  .game:hover { border-color:var(--line2); background:#201e1b; }
  .game h3 { margin:0; font-size:17px; font-weight:500; line-height:1.4; }
  .game .meta { font-size:12px; color:var(--t3); display:flex; gap:12px; align-items:center; }
  .game .meta span { display:inline-flex; align-items:center; gap:4px; }
  .game .meta .ic { width:14px; height:14px; }
  .game .st { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--t2); }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:8px; vertical-align:1px; background:var(--t3); }
  .dot.t1 { background:var(--acc); } .dot.t2 { background:var(--t2); } .dot.t3 { background:transparent; border:1px solid var(--t3); }
  .game { padding:0; overflow:hidden; gap:0; }
  .game .cv { aspect-ratio:460/215; background:var(--deep); border-bottom:1px solid var(--line); position:relative; overflow:hidden; }
  .game .cv img { width:100%; height:100%; object-fit:cover; display:block; }
  .game .cv .fb { position:absolute; inset:0; display:flex; align-items:flex-end; padding:12px 20px; font:500 56px/1 var(--mono); color:rgba(239,233,222,.12); }
  .game .cv .lang { position:absolute; top:12px; right:12px; font:500 11px var(--mono); background:rgba(18,17,15,.85); border:1px solid var(--line2); border-radius:6px; padding:2px 8px; color:var(--t1); }
  .game .gb { padding:16px 20px 20px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .mix { display:grid; gap:8px; }
  .mix .r { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; font-size:12px; color:var(--t2); }
  .mix .r .n { color:var(--t3); font-family:var(--mono); } .mix .r .p { font-family:var(--mono); color:var(--t1); min-width:40px; text-align:right; }
  .mix .b { grid-column:1/-1; height:4px; background:var(--raised); border-radius:2px; overflow:hidden; }
  .mix .b i { display:block; height:100%; border-radius:2px; }
  .c-f { background:var(--t2); } .c-p { background:var(--acc); } .c-h { background:var(--pos); }
  .tot { display:flex; justify-content:space-between; font-size:12px; color:var(--t3); padding-top:12px; border-top:1px solid var(--line); margin-top:auto; }
  .stack { display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--raised); margin-top:16px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--t2); margin-top:8px; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:0; }
  .engcard { background:var(--deep); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .engcard .l { font-size:12px; color:var(--t3); }
  .engcard .eh { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
  .engcard .en { font-size:20px; font-weight:500; margin-top:4px; }
  .engcard .ep { font-size:28px; font-weight:500; margin-top:4px; }
  .engcard .bar { margin-top:16px; }
  .engcard .ecols { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; margin-top:16px; }
  .engcard ul { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; font-size:13px; color:var(--t2); }
  .engcard li { display:flex; gap:8px; align-items:flex-start; } .engcard li .ic { width:14px; height:14px; margin-top:3px; color:var(--pos); }
  .engcard ul.no li .ic { color:var(--t3); }
  .olsteps { display:flex; gap:16px; flex-wrap:wrap; width:100%; font-size:13px; color:var(--t3); margin-bottom:4px; }
  .olsteps span { display:inline-flex; align-items:center; gap:6px; }
  .olsteps b { width:18px; height:18px; border-radius:50%; border:1px solid var(--line2); display:inline-grid; place-items:center; font:500 11px var(--mono); }
  .olsteps .done { color:var(--pos); } .olsteps .now { color:var(--t1); } .olsteps .now b { border-color:var(--acc); color:var(--acc-text); }
  .modes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .modes button { text-align:left; background:var(--deep); border:1px solid var(--line2); border-radius:12px; padding:16px; color:var(--t1); font:inherit; cursor:pointer; display:grid; gap:4px; transition:border-color .15s var(--ease), background-color .15s var(--ease); }
  .modes button:hover { border-color:rgba(239,233,222,.24); }
  .modes button.on { border-color:var(--acc); background:#1d1a24; box-shadow:inset 0 0 0 1px var(--acc); }
  .modes b { font-weight:500; font-size:15px; } .modes span { font-size:13px; color:var(--t2); line-height:1.5; }
  .modes .tag { font:500 11px var(--mono); color:var(--t3); margin-top:4px; }
  .models { display:grid; gap:8px; margin-top:16px; }
  .models label { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 16px; border:1px solid var(--line); border-radius:8px; background:var(--deep); cursor:pointer; }
  .models label:has(input:checked) { border-color:var(--acc); }
  .models input { accent-color:var(--acc); }
  .models .nm { font-size:14px; } .models .ps { font-size:12px; color:var(--t3); display:block; }
  .models .pr { font:500 14px var(--mono); text-align:right; } .models .pr small { display:block; font-size:11px; color:var(--t3); font-weight:400; }
  .rf { max-width:880px; margin:0 auto; padding-top:32px; }
  .rf .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; margin-top:16px; }
  .rf .lbl { font-size:12px; color:var(--t3); margin-bottom:8px; display:flex; justify-content:space-between; gap:8px; }
  .rf .src { font-family:var(--mono); font-size:15px; line-height:1.7; white-space:pre-wrap; background:var(--deep); border:1px solid var(--line); border-radius:8px; padding:12px 16px; }
  .rf .cur { font-size:17px; line-height:1.7; white-space:pre-wrap; padding:12px 16px; border-left:2px solid var(--line2); }
  .rf textarea { font-size:17px; min-height:96px; }
  .rf .pos { font-family:var(--mono); font-size:12px; color:var(--t3); }
  .kbd { font:500 11px var(--mono); border:1px solid var(--line2); border-bottom-width:2px; border-radius:4px; padding:0 6px; color:var(--t2); }
  .empty { padding:64px 24px; text-align:center; color:var(--t2); border:1px dashed var(--line2); border-radius:12px; grid-column:1/-1; }
  .empty b { display:block; color:var(--t1); font-weight:500; margin-bottom:8px; }

  /* game page */
  .back { display:inline-flex; align-items:center; gap:8px; margin:32px 0 24px; font-size:14px; color:var(--t2); text-decoration:none; }
  .back:hover { color:var(--t1); }
  .gp { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:32px; align-items:start; }
  .gp h1 { font-size:32px; font-weight:500; line-height:1.3; margin:0 0 8px; }
  .gp .lead { color:var(--t2); margin:0 0 32px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  .panel + .panel { margin-top:16px; }
  .side { position:sticky; top:80px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:14px; margin:0; }
  .kv dt { color:var(--t3); } .kv dd { margin:0; }
  .mod .head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .mod .name { font-size:17px; font-weight:500; display:flex; align-items:center; gap:8px; }
  .mod .name .ic { color:var(--acc-text); }
  .mod .sub { font-size:12px; color:var(--t3); margin-top:4px; }
  .access { font-size:13px; color:var(--t2); display:flex; align-items:center; }
  .bar { height:4px; background:var(--raised); border-radius:2px; overflow:hidden; margin-top:16px; }
  .bar i { display:block; height:100%; background:var(--acc); border-radius:2px; }
  .barlabel { display:flex; justify-content:space-between; font-size:12px; color:var(--t3); margin-top:8px; }
  .mod h4 { font-size:14px; font-weight:500; margin:24px 0 12px; color:var(--t2); }
  ol.steps { margin:0; padding:0; list-style:none; counter-reset:s; display:grid; gap:8px; }
  ol.steps li { counter-increment:s; display:grid; grid-template-columns:24px 1fr; gap:12px; font-size:14px; line-height:1.7; }
  ol.steps li::before { content:counter(s); font-family:var(--mono); font-size:12px; color:var(--t3); width:24px; height:24px; border:1px solid var(--line2); border-radius:6px; display:grid; place-items:center; margin-top:2px; }
  .note { font-size:13px; line-height:1.7; color:var(--t2); background:var(--deep); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-top:16px; display:flex; gap:12px; }
  .note .ic { margin-top:3px; color:var(--t3); }
  .note.ok { border-color:rgba(76,195,138,.25); color:#bfe8d2; } .note.ok .ic { color:var(--pos); }
  .note.bad { border-color:rgba(229,72,77,.3); color:#f3c0c2; } .note.bad .ic { color:var(--neg); }
  .note.warn { border-color:rgba(148,116,230,.35); color:#d6cbf5; } .note.warn .ic { color:var(--acc); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:24px; padding-top:24px; border-top:1px solid var(--line); }
  .actions .spacer { flex:1; }
  .ginfo { margin-top:16px; }

  /* support */
  .qrwrap { display:grid; grid-template-columns:208px 1fr; gap:24px; margin-top:16px; align-items:start; }
  .qr { background:#f7f4ee; color:#1f1b16; border-radius:12px; padding:16px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .qr .pp { font:500 12px var(--sans); color:#5e554a; margin-bottom:8px; }
  .qr img { width:176px; height:176px; image-rendering:pixelated; display:block; margin:0 auto; }
  .qr small { display:block; margin-top:8px; font-size:12px; color:#5e554a; }
  .amts { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .amts button { height:32px; padding:0 12px; border-radius:8px; background:var(--raised); border:1px solid var(--line); color:var(--t1); font:400 13px var(--mono); cursor:pointer; }
  .amts button.on { border-color:var(--acc); color:var(--acc-text); }

  /* tables */
  table.tiers { width:100%; border-collapse:collapse; font-size:14px; }
  table.tiers td { padding:16px 0; border-top:1px solid var(--line); vertical-align:top; line-height:1.7; }
  table.tiers td:first-child { width:160px; color:var(--t2); padding-right:16px; }
  table.tiers b { font-weight:500; }

  /* translate (web) */
  .tw { display:grid; grid-template-columns:1fr 1.1fr; gap:64px; align-items:center; padding:80px 0; }
  .tw h1 { font-size:36px; font-weight:500; line-height:1.3; margin:0 0 16px; }
  .tw ol.steps { margin:32px 0; }
  .studio-mini { background:var(--deep); border:1px solid var(--line2); border-radius:16px; overflow:hidden; box-shadow:0 24px 48px rgba(0,0,0,.35); }
  .studio-mini .bar2 { height:40px; display:flex; align-items:center; gap:8px; padding:0 16px; border-bottom:1px solid var(--line); font-size:12px; color:var(--t3); }
  .studio-mini .r { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--line); }
  .studio-mini .r > div { padding:12px 16px; font-size:13px; line-height:1.6; }
  .studio-mini .r > div:first-child { font-family:var(--mono); font-size:12px; color:var(--t3); border-right:1px solid var(--line); }
  .studio-mini .r.sel { background:var(--raised); box-shadow:inset 2px 0 0 var(--acc); }
  .studio-mini .ft { display:flex; justify-content:space-between; padding:12px 16px; font-size:12px; color:var(--t3); }

  /* studio (app) */
  .studio { padding-top:32px; display:grid; gap:16px; }
  .studio h1 { font-size:28px; font-weight:500; margin:0 0 8px; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-top:24px; }
  .stat { background:var(--deep); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat .l { font-size:12px; color:var(--t3); } .stat .v { font-size:24px; font-weight:500; margin-top:4px; line-height:1.3; }
  .stat .v.sm { font-size:15px; margin-top:8px; }
  .ptitle { font-size:15px; font-weight:500; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .ed { width:100%; border-collapse:collapse; font-size:14px; table-layout:fixed; }
  .ed th { text-align:left; font-weight:500; font-size:12px; color:var(--t3); padding:8px 12px; border-bottom:1px solid var(--line2); }
  .ed td { padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; width:50%; white-space:pre-wrap; line-height:1.7; }
  .ed td.src { font-family:var(--mono); font-size:13px; color:var(--t2); }
  .ed td.src .clip { display:block; max-height:180px; overflow:auto; }
  .ed td.src small { display:block; font-family:var(--sans); color:var(--t3); font-size:11px; margin-bottom:4px; }
  .ed textarea { min-height:40px; }
  .ed textarea.saved { border-color:var(--pos); }
  .pager { display:flex; align-items:center; gap:8px; margin-top:16px; font-size:13px; color:var(--t3); }
  .pbar { height:4px; background:var(--raised); border-radius:2px; overflow:hidden; margin-top:16px; }
  .srcrow { display:grid; grid-template-columns:20px minmax(0,1fr); gap:8px; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--deep); cursor:pointer; font-size:14px; }
  .srcrow input { margin-top:4px; accent-color:var(--acc); }
  .srcname { word-break:break-all; }
  .srcsample { display:block; font-size:12px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .pbar i { display:block; height:100%; width:0; background:var(--acc); transition:transform .3s var(--ease); transform-origin:left; }
  .demo-flag { font-size:12px; color:var(--t3); border:1px solid var(--line2); border-radius:6px; padding:2px 8px; }

  /* account + modal */
  .acct { padding-top:32px; display:grid; grid-template-columns:300px minmax(0,1fr); gap:32px; align-items:start; }
  .who-card { text-align:left; }
  .who-card .avatar { width:56px; height:56px; font-size:20px; margin-bottom:16px; }
  .who-card h2 { font-size:20px; font-weight:500; margin:0; }
  .pill { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--t2); border:1px solid var(--line2); border-radius:6px; padding:2px 8px; margin-top:12px; }
  .formgrid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; }
  .formgrid .full { grid-column:1/-1; }
  dialog { background:var(--card); color:var(--t1); border:1px solid var(--line2); border-radius:16px; padding:32px; width:min(400px,calc(100vw - 32px)); box-shadow:0 24px 64px rgba(0,0,0,.5); }
  dialog::backdrop { background:rgba(10,9,8,.7); }
  dialog h2 { font-size:20px; font-weight:500; margin:0 0 8px; }
  dialog p { color:var(--t2); font-size:14px; margin:0 0 24px; }
  .gbtn { width:100%; justify-content:center; }

  footer { border-top:1px solid var(--line); }
  footer .in { max-width:1200px; margin:0 auto; padding:32px 24px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--t3); }

  @media (max-width:900px) {
    .hero, .tw { grid-template-columns:1fr; gap:48px; padding:48px 0; }
    .hero h1 { font-size:36px; } .tw h1 { font-size:30px; }
    .gp, .acct { grid-template-columns:1fr; } .side { position:static; }
    .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (max-width:720px) {
    .top .in { gap:16px; padding:0 16px; }
    .links { display:none; position:absolute; top:56px; left:0; right:0; background:var(--bg); border-bottom:1px solid var(--line); flex-direction:column; padding:8px 16px 16px; }
    .links.open { display:flex; }
    .links a { padding:10px 12px; font-size:15px; }
    .auth { margin-left:auto; } .menubtn { display:inline-flex; }
    .game { min-height:0; }
    .auth .label { display:none; }
    main { padding:0 16px 64px; }
    .dlg .dst { font-size:18px; }
    .qrwrap, .formgrid { grid-template-columns:1fr; }
    .modes { grid-template-columns:1fr; } .engcard .ecols { grid-template-columns:1fr; }
    .ed td { display:block; width:100%; } .ed td.src { border-bottom:0; padding-bottom:0; } .ed thead { display:none; }
    .dlg-wrap .ghost { display:none; }
  }
.upl{display:flex;gap:24px;align-items:center;justify-content:space-between;padding:16px;border:1px solid var(--line2);border-radius:10px;background:var(--raised);margin-top:16px}

.updbar{background:var(--raised);border-bottom:1px solid var(--line2)}
.updbar .in{max-width:1200px;margin:0 auto;padding:10px 24px;display:flex;gap:12px;align-items:center;font-size:14px}
.updbar .in span{flex:1}.updbar .in svg{color:var(--brand-t,#b8a2f2)}
.avatar.sm{width:24px;height:24px;font-size:11px;margin:0}
.vb{display:inline-flex;margin-left:6px;color:var(--brand-t,#b8a2f2);vertical-align:-2px}
.glist{display:grid}.grow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.grow:first-child{border-top:0}.grow:hover b{text-decoration:underline}.grow .gt{display:grid;min-width:0}.grow .gt span{font-size:13px}
.contrib h4{margin:20px 0 10px}.people{display:flex;flex-wrap:wrap;gap:8px}

  const tag = acc.length >= 15 ? '03' : acc.length >= 13 ? '02' : '01';
  if (tag === '01') acc = ('0000000000000' + acc.replace(/^0/, '66')).slice(-13);

  let p = f('00', '01') + f('01', amount ? '12' : '11') + f('29', f('00', 'A000000677010111') + f(tag, acc)) + f('58', 'TH') + f('53', '764');

  for (let i = 0; i < p.length; i++) {
    crc ^= p.charCodeAt(i) << 8;
    for (let k = 0; k < 8; k++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;

    const w = await (await dir.getFileHandle(name, { create: true })).createWritable();
    await w.write(data); await w.close();
  }
  async function list(dir) {
    const out = [];
    for await (const [name, h] of dir.entries()) out.push({ name, h });
    return out.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  }
  async function copyTree(src, dst) {
    for (const { name, h } of await list(src)) {
      if (h.kind === 'directory') await copyTree(h, await dst.getDirectoryHandle(name, { create: true }));
      else await write(dst, name, await readBytes(src, name));
    }
  }

  // ---------------------------------------------------------- detect
  async function detect(gameDir) {
    const www = await sub(gameDir, 'www');
    for (const [root, isWww] of [[gameDir, false], [www, true]]) {
      if (!root) continue;
      const data = await sub(root, 'data');
      if (!data || !(await fileH(data, 'System.json'))) continue;
      const js = await sub(root, 'js');
      let engine;
      if (js && (await fileH(js, 'rmmz_core.js'))) engine = 'RPG Maker MZ';
      else if (js && (await fileH(js, 'rpg_core.js'))) engine = 'RPG Maker MV';
      else engine = isWww ? 'RPG Maker MV' : 'RPG Maker MZ';
      const backup = await sub(root, BACKUP_DIR);
      const bdata = backup && (await sub(backup, 'data'));
      const sys = await readJSON(bdata && (await fileH(bdata, 'System.json')) ? bdata : data, 'System.json');
      return { engine, root, data, bdata, title: sys.gameTitle || '', installed: !!bdata };
    }
    return null;
  }

  // ---------------------------------------------------------- walk (เหมือน Python)
  const isText = s => typeof s === 'string' && s.trim() !== '';
  const or = (a, b) => (a ? a : b);

  function walkEvents(cmds, visit, ctx) {
    const out = [];
    let i = 0;
    while (i < cmds.length) {
      const c = cmds[i], code = c.code;
      if (code === 401 || code === 405) {
        let j = i; const lines = [];
        while (j < cmds.length && cmds[j].code === code) {
          const p = cmds[j].parameters;
          lines.push(p && p.length ? p[0] : '');
          j++;
        }
        const block = lines.join('\n');
        const nw = isText(block) ? visit(block, code === 401 ? 'dialogue' : 'scroll', ctx) : null;
        if (!nw) for (let k = i; k < j; k++) out.push(cmds[k]);
        else for (const line of nw.split('\n')) out.push({ code, indent: c.indent ?? 0, parameters: [line] });
        i = j; continue;
      }
      const p = [...(c.parameters || [])];
      if (code === 101 && p.length > 4 && isText(p[4])) p[4] = or(visit(p[4], 'speaker', ctx), p[4]);
      else if (code === 102 && p.length && Array.isArray(p[0])) p[0] = p[0].map(s => (isText(s) ? or(visit(s, 'choice', ctx), s) : s));
      else if (code === 402 && p.length > 1 && isText(p[1])) p[1] = or(visit(p[1], 'choice', ctx), p[1]);
      else if ([320, 324, 325].includes(code) && p.length > 1 && isText(p[1])) p[1] = or(visit(p[1], 'name', ctx), p[1]);
      out.push({ ...c, parameters: p });
      i++;
    }
    return out;
  }

  function walkFile(name, obj, visit) {
    const ctx = { file: name };
    const mapList = (arr, kind) => arr.map(s => (isText(s) ? or(visit(s, kind, ctx), s) : s));
    if (DB_FIELDS[name]) {
      for (const row of obj) {
        if (!row || typeof row !== 'object' || !Object.keys(row).length) continue;
        for (const k of DB_FIELDS[name]) if (isText(row[k])) row[k] = or(visit(row[k], 'db', ctx), row[k]);
      }
    } else if (name === 'System.json') {
      if (isText(obj.gameTitle)) obj.gameTitle = or(visit(obj.gameTitle, 'title', ctx), obj.gameTitle);
      if (isText(obj.currencyUnit)) obj.currencyUnit = or(visit(obj.currencyUnit, 'term', ctx), obj.currencyUnit);
      for (const k of SYSTEM_LISTS) if (Array.isArray(obj[k])) obj[k] = mapList(obj[k], 'term');
      const terms = obj.terms || {};
      for (const k of TERM_LISTS) if (Array.isArray(terms[k])) terms[k] = mapList(terms[k], 'term');
      const msgs = terms.messages || {};
      for (const k of Object.keys(msgs)) if (isText(msgs[k])) msgs[k] = or(visit(msgs[k], 'term', ctx), msgs[k]);
    } else if (name === 'CommonEvents.json') {
      for (const ev of obj) if (ev && Array.isArray(ev.list)) ev.list = walkEvents(ev.list, visit, ctx);
    } else if (name === 'Troops.json') {
      for (const tr of obj) for (const pg of (tr || {}).pages || []) pg.list = walkEvents(pg.list || [], visit, ctx);
    } else if (/^Map\d+\.json$/.test(name)) {
      if (isText(obj.displayName)) obj.displayName = or(visit(obj.displayName, 'map', ctx), obj.displayName);
      for (const ev of obj.events || []) for (const pg of (ev || {}).pages || []) pg.list = walkEvents(pg.list || [], visit, ctx);
    }
    return obj;
  }

  async function jsonNames(dir) {
    return (await list(dir)).filter(e => e.h.kind === 'file' && e.name.endsWith('.json')).map(e => e.name);
  }

  // ---------------------------------------------------------- API
  async function extract(info) {
    const src = info.bdata || info.data;
    const seen = new Set();
    for (const name of await jsonNames(src)) {
      walkFile(name, await readJSON(src, name), t => { seen.add(t); return null; });
    }
    return seen;
  }

  async function install(gameDir, entries, fontBytes, onStep = () => {}) {
    let info = await detect(gameDir);
    if (!info) throw new Error('ไม่เจอเกม RPG Maker MV/MZ ในโฟลเดอร์นี้');
    if (!info.installed) {
      onStep('กำลังสำรองไฟล์เดิม...');
      const broot = await info.root.getDirectoryHandle(BACKUP_DIR, { create: true });
      await copyTree(info.data, await broot.getDirectoryHandle('data', { create: true }));
      const fonts = await sub(info.root, 'fonts');
      if (fonts && (await fileH(fonts, 'gamefont.css'))) await write(broot, 'gamefont.css', await readBytes(fonts, 'gamefont.css'));
      info = await detect(gameDir);
    }
    let count = 0;
    const visit = t => { const v = entries[t]; if (v && v !== t) { count++; return v; } return null; };
    const names = await jsonNames(info.bdata);
    for (let i = 0; i < names.length; i++) {
      const name = names[i];
      onStep(`กำลังใส่คำแปล ${i + 1}/${names.length}`);
      const obj = walkFile(name, await readJSON(info.bdata, name), visit);
      if (name === 'System.json' && info.engine === 'RPG Maker MZ') {
        obj.advanced = obj.advanced || {};
        obj.advanced.mainFontFilename = FONT_NAME;
      }
      await write(info.data, name, JSON.stringify(obj));
    }
    onStep('กำลังใส่ฟอนต์ไทย...');
    const fonts = await info.root.getDirectoryHandle('fonts', { create: true });
    await write(fonts, FONT_NAME, fontBytes);
    if (info.engine === 'RPG Maker MV') {
      await write(fonts, 'gamefont.css', '@font-face {\n    font-family: GameFont;\n    src: url("' + FONT_NAME + '");\n}\n');
    }
    return count;
  }

  async function uninstall(gameDir) {
    const info = await detect(gameDir);
    if (!info || !info.installed) throw new Error('เกมนี้ยังไม่ได้ติดตั้ง mod');
    const broot = await info.root.getDirectoryHandle(BACKUP_DIR);
    await info.root.removeEntry('data', { recursive: true });
    await copyTree(info.bdata, await info.root.getDirectoryHandle('data', { create: true }));
    const fonts = await sub(info.root, 'fonts');
    if (await fileH(broot, 'gamefont.css')) await write(fonts, 'gamefont.css', await readBytes(broot, 'gamefont.css'));
    if (fonts && (await fileH(fonts, FONT_NAME))) await fonts.removeEntry(FONT_NAME);
    await info.root.removeEntry(BACKUP_DIR, { recursive: true });
  }

  function readMod(text) {
    if (text.length > 50 * 1024 * 1024) throw new Error('ไฟล์ mod ใหญ่เกินไป');
    let data;
    try { data = JSON.parse(text.charCodeAt(0) === 0xfeff ? text.slice(1) : text); }
    catch { throw new Error('ไฟล์นี้ไม่ใช่ไฟล์ mod (ต้องเป็น .moddi.json)'); }
    if (!data || typeof data !== 'object' || (data.format !== MOD_FORMAT && !OLD_FORMATS.includes(data.format))) throw new Error('รูปแบบไฟล์ mod ไม่ถูกต้อง');
    if (!data.entries || typeof data.entries !== 'object' || Array.isArray(data.entries)) throw new Error('ไฟล์ mod ไม่มีคำแปล');
    const entries = Object.create(null);
    for (const [k, v] of Object.entries(data.entries)) {
      if (typeof v !== 'string') throw new Error('ไฟล์ mod มีข้อมูลที่ไม่ใช่ข้อความ');
      if (v.length > 10000 || /<\s*script/i.test(v)) throw new Error('ไฟล์ mod มีเนื้อหาน่าสงสัย');
      entries[k] = v;
    }
    const origin = Object.create(null);
    if (data.origin && typeof data.origin === 'object')
      for (const [k, v] of Object.entries(data.origin)) if (k in entries && ['f', 'p', 'h'].includes(v)) origin[k] = v;
    return { title: String(data.title || ''), translator: String(data.translator || ''), engine: String(data.engine || ''),
             created: String(data.created || ''), entries, origin };
  }

  return { detect, extract, install, uninstall, readMod };
})();
if (typeof module !== 'undefined') module.exports = Moddi;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let CAT = { hub: {}, games: [] };
const state = { q: '', plat: 'all', easy: false };
const APP = { mode: 'web' };  // 'app' = รันในโปรแกรม moddi (มี /api)

$('#menubtn').innerHTML = icon('menu');
$('#menubtn').onclick = () => $('#links').classList.toggle('open');

// ================================================================ data
async function boot() {
  try { CAT = await (await fetch('catalog.json', { cache: 'no-cache' })).json(); }
  catch { $('#app').innerHTML = '<div class="empty" style="margin-top:64px"><b>โหลดรายการเกมไม่ได้</b>ลองรีเฟรชหน้านี้อีกครั้ง</div>'; return; }
  CAT.games = (CAT.games || []).map(g => ({ ...g, mods: (g.mods || []).filter(m => [1, 2, 3].includes(m.tier)) })).filter(g => g.mods.length);
  try {
    const r = await fetch('api/progress', { method: 'POST', body: '{}' });
    const j = await r.json(); if (r.ok && 'running' in j) APP.mode = 'app';
  } catch {}
  await Auth.init();
  await Lib.inject();
  route();
  if (APP.mode === 'app') checkUpdate();
}
const bestTier = g => Math.min(...g.mods.map(m => m.tier));
const isEasy = g => g.mods.some(m => m.tier === 1 && m.install === 'moddi');
const ACCESS = { 1: 'ติดตั้งผ่านคลัง', 2: 'ลิงก์ไปโพสต์ผู้แปล', 3: 'ดูที่เพจผู้แปล' };
const PLAT = { pc: ['monitor', 'PC'], mobile: ['smartphone', 'มือถือ'] };
const plats = g => (g.platforms || []).map(p => PLAT[p] ? `<span>${icon(PLAT[p][0])}${PLAT[p][1]}</span>` : '').join('');

// ================================================================ stats bars
const ORIGIN = { f: ['แปลด่วน', 'c-f'], p: ['แปลพรีเมียม', 'c-p'], h: ['คนเกลา', 'c-h'] };
const pct = (n, t) => t ? Math.round(100 * n / t) : 0;
function mixBars(st) {
  if (!st || !st.total) return '';
  return `<div class="mix">${[['f', st.fast], ['p', st.premium], ['h', st.human]].map(([k, n]) => `<div class="r">
      <span>${ORIGIN[k][0]}</span><span class="n">${(n || 0).toLocaleString()} บรรทัด</span><span class="p">${pct(n || 0, st.total)}%</span>
      <div class="b"><i class="${ORIGIN[k][1]}" style="width:${pct(n || 0, st.total)}%"></i></div></div>`).join('')}</div>`;
}
function stackBar(st) {
  if (!st || !st.total) return '';
  const left = Math.max(0, st.total - st.fast - st.premium - st.human);
  return `<div class="stack">${[['c-f', st.fast], ['c-p', st.premium], ['c-h', st.human]].map(([c, n]) => n ? `<i class="${c}" style="width:${100 * n / st.total}%"></i>` : '').join('')}</div>
    <div class="legend">${[['f', st.fast], ['p', st.premium], ['h', st.human]].map(([k, n]) => `<span><i class="${ORIGIN[k][1]}"></i>${ORIGIN[k][0]} <span class="mono">${(n || 0).toLocaleString()}</span></span>`).join('')}
    <span><i style="background:var(--raised);border:1px solid var(--line2)"></i>ยังไม่แปล <span class="mono">${left.toLocaleString()}</span></span></div>`;
}
const initials = t => esc(t.split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase());
const coverUrl = g => g.cover || (g.steam_appid ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${encodeURIComponent(g.steam_appid)}/header.jpg` : '');
const findMod = id => { for (const g of CAT.games) for (const m of g.mods) if (m.id === id) return [g, m]; return [null, null]; };


// ================================================================ คลังชุมชน: ใครก็อัพงานที่แปลค้างไว้ได้ แล้วคนอื่นแปลต่อ
// ทุกครั้งที่อัพ = รวมกับฉบับล่าสุดในคลังก่อน (ไม่มีงานใครหาย) แล้วเก็บเป็นเวอร์ชันใหม่ ประวัติอยู่ครบ ย้อนได้
const RANK = { f: 1, p: 2, h: 3 };
const Lib = {
  key(m) {
    if (m.steam_appid) return 'steam-' + String(m.steam_appid).replace(/\D/g, '');
    return ((m.engine || '').split(' ')[0] + '-' + (m.title || 'game')).toLowerCase().normalize('NFKD').replace(/[^a-z0-9ก-๙]+/g, '-').replace(/^-|-$/g, '').slice(0, 80);
  },
  clean(raw) {  // รับแค่ข้อความล้วน ตามรูปแบบไฟล์ mod
    const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!d || !/^(moddi|thaimod)\/1$/.test(d.format) || typeof d.entries !== 'object') throw new Error('ไฟล์ mod ไม่ถูกต้อง');
    const entries = {}, origin = {};
    for (const [k, v] of Object.entries(d.entries)) if (typeof k === 'string' && typeof v === 'string' && v && k.length < 5000 && v.length < 5000) {
      entries[k] = v; origin[k] = RANK[(d.origin || {})[k]] ? d.origin[k] : 'f'; }
    const glossary = {}; for (const [k, v] of Object.entries(d.glossary || {})) if (typeof v === 'string') glossary[k] = v;
    return { format: 'moddi/1', title: String(d.title || '').slice(0, 200), engine: String(d.engine || '').slice(0, 60), kind: d.kind === 'unity' ? 'unity' : 'rpgmaker',
      steam_appid: String(d.steam_appid || '').replace(/\D/g, ''), from_lang: String(d.from_lang || 'en').slice(0, 8),
      total_lines: Math.max(0, +d.total_lines || 0), entries, origin, glossary };
  },
  // รวมสองฉบับ: บรรทัดที่คนเกลาชนะเครื่องแปล พรีเมียมชนะแปลด่วน ระดับเท่ากันใช้ของที่อัพใหม่
  merge(base, mine) {
    const out = { ...mine, entries: { ...(base ? base.entries : {}) }, origin: { ...(base ? base.origin : {}) }, glossary: { ...(base ? base.glossary : {}), ...mine.glossary } };
    let added = 0, kept = 0;
    for (const [k, v] of Object.entries(mine.entries)) {
      const o = mine.origin[k] || 'f', old = out.origin[k];
      if (!(k in out.entries)) added++;
      if (!old || RANK[o] >= RANK[old]) { out.entries[k] = v; out.origin[k] = o; } else kept++;
    }
    out.total_lines = Math.max(mine.total_lines, base ? base.total_lines : 0, Object.keys(out.entries).length);
    out.stats = this.stats(out);
    out.from_others = base ? Object.keys(base.entries).filter(k => !(k in mine.entries)).length : 0;
    out.added = added; out.kept = kept;
    return out;
  },
  stats(m) {
    const c = { f: 0, p: 0, h: 0 }; for (const k in m.entries) c[m.origin[k] || 'f']++;
    return { total: m.total_lines, fast: c.f, premium: c.p, human: c.h };
  },
  async latest(key) {
    if (Auth.demo) { const t = store.get('lib:file:' + key); return t ? this.clean(t) : null; }
    const { data } = await Auth.client.from('library_latest').select('path').eq('game_key', key).maybeSingle();
    if (!data) return null;
    const url = Auth.client.storage.from('library').getPublicUrl(data.path).data.publicUrl;
    return this.clean(await (await fetch(url, { cache: 'no-cache' })).text());
  },
  async text(key) { const m = await this.latest(key); if (!m) throw new Error('ไม่พบไฟล์ในคลัง'); return JSON.stringify(m); },
  async upload(raw) {
    if (!Auth.user) throw new Error('ต้องเข้าสู่ระบบก่อน');
    const mine = this.clean(raw);
    if (!Object.keys(mine.entries).length) throw new Error('ยังไม่มีบรรทัดที่แปล');
    const key = this.key(mine), merged = this.merge(await this.latest(key), mine);
    const { added, kept, from_others, ...file } = merged;
    file.updated = new Date().toISOString().slice(0, 10); file.translator = 'ชุมชน moddi';
    const row = { game_key: key, title: mine.title, engine: mine.engine, kind: mine.kind, steam_appid: mine.steam_appid || null, from_lang: mine.from_lang,
      total: file.stats.total, fast: file.stats.fast, premium: file.stats.premium, human: file.stats.human, user_name: Auth.user.name, lines_added: added };
    const text = JSON.stringify(file);
    if (Auth.demo) {
      try { localStorage.setItem('lib:file:' + key, JSON.stringify(text)); }
      catch { throw new Error('ไฟล์ใหญ่เกินที่โหมดตัวอย่างเก็บได้ ต้องเชื่อม Supabase ก่อน'); }
      const idx = store.get('lib:index') || []; idx.push({ ...row, user_id: Auth.user.id, created_at: new Date().toISOString() }); store.set('lib:index', idx);
    } else {
      const path = `${Auth.user.id}/${key}/${Date.now()}.moddi.json`;
      const up = await Auth.client.storage.from('library').upload(path, new Blob([text], { type: 'application/json' }));
      if (up.error) throw new Error(up.error.message);
      const { error } = await Auth.client.from('library_uploads').insert({ ...row, path, user_id: Auth.user.id });
      if (error) throw new Error(error.message);
    }
    return { key, file, added, kept, from_others };
  },
  async list() {
    if (Auth.demo) {
      const by = {}; for (const r of store.get('lib:index') || []) {
        const g = by[r.game_key] || (by[r.game_key] = { ...r, people: new Set(), versions: 0 });
        Object.assign(g, r, { people: g.people.add(r.user_id), versions: g.versions + 1 }); }
      return Object.values(by).map(g => ({ ...g, contributors: g.people.size }));
    }
    const { data } = await Auth.client.from('library_latest').select('*');
    return data || [];
  },
  // ใส่เกมจากคลังชุมชนเข้ารายการเกม
  async inject() {
    let rows = []; try { rows = await this.list(); } catch {}
    for (const r of rows) {
      const mod = { id: 'lib-' + r.game_key, tier: 1, community: true, install: r.kind === 'rpgmaker' ? 'moddi' : 'moddi_app', file: 'lib:' + r.game_key,
        updated: String(r.created_at || '').slice(0, 10), last_by: r.user_name, contributors: r.contributors || 1, versions: r.versions || 1,
        translator: { name: 'ชุมชน moddi' }, stats: { total: r.total, fast: r.fast, premium: r.premium, human: r.human } };
      let g = CAT.games.find(x => (r.steam_appid && String(x.steam_appid) === String(r.steam_appid)) || x.title.toLowerCase() === String(r.title).toLowerCase());

      g.mods = g.mods.filter(m => m.id !== mod.id); g.mods.unshift(mod);

};

async function checkUpdate() {

  const bar = $('#updbar');

// ================================================================ โปรไฟล์ผู้ใช้ + หน้าผู้แปลสาธารณะ
const Profiles = {
  cache: {},
  async get(uid) {
    if (!uid) return null;
    if (this.cache[uid]) return this.cache[uid];
    let p = null;
    if (Auth.demo) p = (store.get('demoProfiles') || {})[uid] || null;
    else { const { data } = await Auth.client.from('profiles').select('*').eq('user_id', uid).maybeSingle(); p = data; }
    return (this.cache[uid] = p);
  },
  async save(fields) {
    const uid = Auth.user.id, row = { ...fields, updated_at: new Date().toISOString() };
    if (Auth.demo) { const all = store.get('demoProfiles') || {}; all[uid] = { ...(all[uid] || { user_id: uid, verified: false }), ...row }; store.set('demoProfiles', all); }
    else {
      const { data: ex } = await Auth.client.from('profiles').select('user_id').eq('user_id', uid).maybeSingle();
      const q = ex ? Auth.client.from('profiles').update(row).eq('user_id', uid) : Auth.client.from('profiles').insert({ user_id: uid, ...fields });
      const { error } = await q; if (error) throw new Error(error.message);
    }
    delete this.cache[uid];
  },
  async uploads(filter) {  // filter: {user_id} หรือ {game_key}
    if (Auth.demo) return (store.get('lib:index') || []).filter(r => Object.entries(filter).every(([k, v]) => r[k] === v));
    let q = Auth.client.from('library_uploads').select('user_id,user_name,game_key,title,engine,steam_appid,lines_added,total,fast,premium,human,created_at').order('created_at', { ascending: false }).limit(1000);
    for (const [k, v] of Object.entries(filter)) q = q.eq(k, v);
    const { data } = await q; return data || [];
  },
  // รวมงานของแต่ละคนในเกมเดียว หรือรวมเกมของคนคนเดียว
  byUser(rows) {
    const m = {}; for (const r of rows) { const x = m[r.user_id] || (m[r.user_id] = { user_id: r.user_id, name: r.user_name, lines: 0, uploads: 0, last: r.created_at });
      x.lines += r.lines_added || 0; x.uploads++; if (r.created_at > x.last) { x.last = r.created_at; x.name = r.user_name; } }
    return Object.values(m).sort((a, b) => b.lines - a.lines);
  },
  byGame(rows) {
    const m = {}; for (const r of rows) { const x = m[r.game_key] || (m[r.game_key] = { key: r.game_key, title: r.title, engine: r.engine, steam_appid: r.steam_appid, lines: 0, uploads: 0, last: r.created_at });
      x.lines += r.lines_added || 0; x.uploads++; if (r.created_at > x.last) x.last = r.created_at; }
    return Object.values(m).sort((a, b) => b.last.localeCompare(a.last));
  },
};

const fmtDate = d => d ? new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) : '';

function wireMod(m) {
  const b = document.querySelector(`[data-support="${CSS.escape(m.id)}"]`);
  if (b) b.onclick = () => {
    const box = document.querySelector(`[data-qr="${CSS.escape(m.id)}"]`);
    if (box.innerHTML) { box.innerHTML = ''; return; }
    box.innerHTML = supportBox(m.translator.name, 'เงินเข้าพร้อมเพย์ของผู้แปลโดยตรงทั้งหมด คลังไม่หักส่วนแบ่ง', 'm-' + m.id);
    wireQR(box, m.translator.promptpay, 'm-' + m.id);
  };

// ================================================================ installer
function fontBytes() { const s = atob(FONT_B64); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
function note(el, kind, msg) {
  const ic = { ok: 'check', bad: 'circle-alert', warn: 'loader', '': 'circle-alert' }[kind];
  el.className = 'note ' + kind; el.innerHTML = `${icon(ic)}<span>${esc(msg)}</span>`;
}
function wireInstaller(m, modData = null) {
  const q = k => document.querySelector(`[data-${k}="${CSS.escape(m.id)}"]`);
  const st = q('status'), info = q('ginfo'), bI = q('inst'), bU = q('unin');
  let dir = null, mod = modData;
  const getMod = async () => mod || (mod = Moddi.readMod(await loadModText(m)));
  async function check() {
    const gi = await Moddi.detect(dir).catch(() => null);
    if (!gi) { info.classList.add('hide'); note(st, 'bad', 'ไม่เจอเกม RPG Maker MV/MZ ในโฟลเดอร์นี้ เลือกโฟลเดอร์ที่มีไฟล์ Game.exe'); bI.disabled = true; bU.classList.add('hide'); return; }
    const md = await getMod(), units = await Moddi.extract(gi);
    let hit = 0; for (const u of units) if (md.entries[u]) hit++;
    const pct = Math.round(100 * hit / Math.max(1, units.size));
    info.innerHTML = `<dl class="kv"><dt>เกมในเครื่อง</dt><dd>${esc(gi.title || dir.name)}</dd><dt>เอนจิน</dt><dd>${esc(gi.engine)}</dd>
      <dt>สถานะ</dt><dd>${gi.installed ? 'ติดตั้ง mod อยู่' : 'ยังไม่ได้ติดตั้ง'}</dd><dt>ตรงกับคำแปล</dt><dd class="mono">${pct}%</dd></dl>`;
    info.classList.remove('hide');
    if (hit === 0) note(st, 'bad', 'คำแปลนี้ไม่ตรงกับเกมในโฟลเดอร์ อาจเลือกผิดเกม');
    else if (pct < 60) note(st, 'warn', 'ตรงกับเกมแค่บางส่วน อาจเป็นเกมคนละเวอร์ชัน บางข้อความจะยังเป็นภาษาเดิม');
    else st.className = 'hide';
    bI.disabled = hit === 0; bU.classList.toggle('hide', !gi.installed);
  }
  q('pick').onclick = async () => {
    if (!('showDirectoryPicker' in window)) return note(st, 'bad', 'ต้องใช้ Chrome หรือ Edge บนคอมพิวเตอร์');
    try { dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'moddi-game' }); }
    catch (e) { if (e.name !== 'AbortError') note(st, 'bad', e.name === 'SecurityError' ? 'หน้านี้เปิดโฟลเดอร์ไม่ได้ ลองเปิดในแท็บใหม่' : e.message); return; }
    try { await check(); } catch (e) { note(st, 'bad', e.message); }
  };
  bI.onclick = async () => {
    bI.disabled = true;
    try {
      const n = await Moddi.install(dir, (await getMod()).entries, fontBytes(), s => note(st, 'warn', s));
      await check(); note(st, 'ok', `ติดตั้งเสร็จ ใส่คำแปลแล้ว ${n.toLocaleString()} จุด เปิดเกมเล่นได้เลย`);
    } catch (e) { note(st, 'bad', 'ติดตั้งไม่สำเร็จ: ' + e.message); bI.disabled = false; }
  };
  bU.onclick = async () => {
    if (!bU.dataset.sure) { bU.dataset.sure = 1; bU.textContent = 'กดอีกครั้งเพื่อยืนยัน'; setTimeout(() => { delete bU.dataset.sure; bU.textContent = 'ถอน mod'; }, 4000); return; }
    delete bU.dataset.sure; bU.textContent = 'ถอน mod';
    try { await Moddi.uninstall(dir); await check(); note(st, 'ok', 'ถอน mod แล้ว เกมกลับเป็นต้นฉบับทุกไฟล์'); }
    catch (e) { note(st, 'bad', e.message); }
  };
}

// ================================================================ เกลาภาษา
// rows: [{src, tgt, origin}] · save(src, newText) · exportFn() · back: hash
function refineView({ title, sub, rows, save, exportFn, uploadFn, back, note: extra }) {
  let filter = 'machine', q = '', idx = 0;
  const list = () => rows.filter(r => (filter === 'all' || (filter === 'machine' ? r.tgt && r.origin !== 'h' : !r.tgt))
    && (!q || (r.src + ' ' + (r.tgt || '')).toLowerCase().includes(q)));
  page(`<div class="rf">
    <a class="back" href="#${esc(back)}" style="margin:0 0 16px">${icon('arrow-left')}กลับ</a>
    <div class="row" style="justify-content:space-between;align-items:end">
      <div><h1 style="font-size:28px;font-weight:500;margin:0">เกลาภาษา</h1><div class="t2" style="font-size:14px">${esc(title)}${sub ? ' · ' + esc(sub) : ''}</div></div>
      <div class="t2" style="font-size:13px">เกลาแล้ว <span class="mono" id="rf-h"></span></div>
    </div>
    <div id="rf-mix" style="margin-top:8px"></div>
    <div class="row" style="margin-top:24px;justify-content:space-between">
      <div class="seg" id="rf-f"><button data-f="machine">แปลโดยเครื่อง</button><button data-f="todo">ยังไม่แปล</button><button data-f="all">ทั้งหมด</button></div>
      <input type="search" id="rf-q" placeholder="ค้นหา" style="max-width:240px">
    </div>
    <div class="card" id="rf-card"></div>
    <div class="actions" style="border:0;padding-top:16px">${uploadFn ? `<button class="btn pri" id="rf-up">${icon('upload')}อัพลงคลัง</button>` : ''}${exportFn ? `<button class="btn sec" id="rf-exp">${icon('download')}ส่งออกไฟล์ที่เกลาแล้ว</button>` : ''}
      <span class="t3" style="font-size:13px">${extra || ''}</span></div>
  </div>`);
  const draw = () => {
    const L = list();
    const human = rows.filter(r => r.origin === 'h').length;
    $('#rf-h').textContent = `${human.toLocaleString()} / ${rows.length.toLocaleString()}`;
    const st = { total: rows.length, fast: rows.filter(r => r.tgt && r.origin === 'f').length, premium: rows.filter(r => r.tgt && r.origin === 'p').length, human };
    $('#rf-mix').innerHTML = stackBar(st);
    $$('#rf-f button').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
    if (!L.length) { $('#rf-card').innerHTML = `<div class="empty" style="border:0;padding:32px"><b>ไม่มีบรรทัดในหมวดนี้แล้ว</b>${filter === 'machine' ? 'เกลาครบทุกบรรทัดที่แปลโดยเครื่องแล้ว' : 'ลองเปลี่ยนหมวดหรือคำค้นหา'}</div>`; return; }
    idx = Math.max(0, Math.min(idx, L.length - 1));
    const r = L[idx], org = r.tgt ? ORIGIN[r.origin || 'f'][0] : 'ยังไม่แปล';
    $('#rf-card').innerHTML = `
      <div class="lbl"><span>ต้นฉบับ</span><span class="pos">${idx + 1} / ${L.length.toLocaleString()}</span></div>
      <div class="src">${esc(r.src)}</div>
      <div class="lbl" style="margin-top:20px"><span>คำแปลตอนนี้</span><span>${org}</span></div>
      <div class="cur">${r.tgt ? esc(r.tgt) : '<span class="t3">ยังไม่มีคำแปล</span>'}</div>
      <label class="f" style="margin-top:20px">คำแปลของคุณ<textarea id="rf-t" rows="${Math.max(3, r.src.split('\n').length + 1)}">${esc(r.tgt || '')}</textarea></label>
      <p class="t3" style="font-size:12px;margin:8px 0 0">เก็บโค้ดอย่าง \\V[1] %1 {0} &lt;color&gt; ไว้เหมือนต้นฉบับ · กด <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> เพื่อบันทึก</p>
      <div class="actions"><button class="btn quiet" id="rf-prev">ก่อนหน้า</button><button class="btn sec" id="rf-skip">ข้าม</button>
        <span class="spacer"></span><button class="btn pri" id="rf-save">${icon('check')}บันทึก แล้วไปต่อ</button></div>`;
    const ta = $('#rf-t'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    const doSave = async () => {
      const v = ta.value.trim();
      if (v && v !== r.tgt) { await save(r.src, v); r.tgt = v; r.origin = 'h'; }
      else if (v && v === r.tgt && r.origin !== 'h') { await save(r.src, v); r.origin = 'h'; }  // ยืนยันว่าคำแปลเดิมดีแล้ว
      if (filter === 'all') idx++;
      draw();
    };
    $('#rf-save').onclick = doSave;
    ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doSave(); } };
    $('#rf-skip').onclick = () => { idx = (idx + 1) % L.length; draw(); };
    $('#rf-prev').onclick = () => { idx = (idx - 1 + L.length) % L.length; draw(); };
  };
  $$('#rf-f button').forEach(b => b.onclick = () => { filter = b.dataset.f; idx = 0; draw(); });
  $('#rf-q').oninput = e => { q = e.target.value.trim().toLowerCase(); idx = 0; draw(); };
  if (exportFn) $('#rf-exp').onclick = exportFn;
  if (uploadFn) $('#rf-up').onclick = uploadFn;
  draw();
}

async function viewRefineMod(id) {
  const [g, m] = findMod(id);
  if (!m || !m.file) return page(`<div class="empty" style="margin-top:64px"><b>ไม่พบคำแปลนี้</b><a href="#home">กลับไปคลังเกม</a></div>`);
  page(`<div class="empty" style="margin-top:64px;border:0">กำลังโหลดคำแปล</div>`);
  let mod;
  try { mod = Moddi.readMod(await loadModText(m)); }
  catch (e) { return page(`<div class="empty" style="margin-top:64px"><b>โหลดไฟล์คำแปลไม่ได้</b>${esc(e.message)}</div>`); }
  const key = 'refine:' + m.id, local = store.get(key) || {};
  const rows = Object.entries(mod.entries).map(([src, tgt]) => local[src] ? { src, tgt: local[src], origin: 'h' }
    : { src, tgt, origin: (mod.origin || {})[src] || 'f' });
  refineView({
    title: g.title, sub: 'คำแปลโดย ' + (m.translator?.name || mod.translator || '-'), rows, back: 'game-' + g.id,
    note: m.community ? 'คำที่เกลาเก็บไว้ในเบราว์เซอร์นี้ก่อน กดอัพลงคลังเมื่อพร้อม ทุกคนจะได้คำที่เกลา' : 'คำที่เกลาเก็บไว้ในเบราว์เซอร์นี้ ส่งออกไฟล์แล้วส่งให้ผู้แปลได้',
    uploadFn: m.community ? async () => {
      if (!Object.keys(local).length) return toast('ยังไม่ได้เกลาบรรทัดไหน');
      if (!Auth.user) return Auth.open('refine-' + m.id);
      try {
        const raw = JSON.parse(await loadModText(m)), mine = { ...raw, entries: {}, origin: {} };
        for (const [k, v] of Object.entries(local)) { mine.entries[k] = v; mine.origin[k] = 'h'; }
        const r = await Lib.upload(mine); for (const k in local) delete local[k]; store.set(key, local);
        toast(`อัพลงคลังแล้ว คนเกลารวม ${r.file.stats.human.toLocaleString()} บรรทัด`);
        await Lib.inject();
      } catch (e) { toast(e.message); }
    } : null,
    save: async (src, v) => { local[src] = v; store.set(key, local); },
    exportFn: () => {
      const out = { format: 'moddi/1', title: mod.title, translator: mod.translator, created: new Date().toISOString().slice(0, 10),
        entries: {}, origin: {} };
      rows.forEach(r => { if (r.tgt) { out.entries[r.src] = r.tgt; out.origin[r.src] = r.origin || 'f'; } });
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
      a.download = (mod.title || 'game') + '.เกลาแล้ว.moddi.json'; a.click();
      toast(`ส่งออกแล้ว เกลาไป ${Object.keys(local).length.toLocaleString()} บรรทัด`);
    },
  });
}

      case 'premium_quote': { const n = src.filter(s => !tr[s]).length; return { lines: n, usd_thb: 33, models: [
        { id: 'google/gemini-2.5-flash', name: 'Gemini 2.5 Flash', pros: 'คุ้มสุด เร็ว ภาษาไทยดี เหมาะกับเกมทั่วไป', usd: 0.002 * n, thb: 0.066 * n },
        { id: 'deepseek/deepseek-chat-v3.1', name: 'DeepSeek V3.1', pros: 'ถูกมาก แปลได้ดี แต่บางครั้งช้า', usd: 0.001 * n, thb: 0.033 * n },
        { id: 'anthropic/claude-sonnet-4.5', name: 'Claude Sonnet 4.5', pros: 'สำนวนดีที่สุด เหมาะกับเกมเน้นเนื้อเรื่อง ราคาสูง', usd: 0.03 * n, thb: 0.99 * n }] }; }
      case 'translate': {

    }
  };
})();

  $('#eq').oninput = () => { clearTimeout(window._qt); window._qt = setTimeout(() => lines(0), 300); };
  $('#ef').onchange = () => lines(0);
  $('#prev').onclick = () => lines(pg - 1); $('#next').onclick = () => lines(pg + 1);
  $('#glsave').onclick = async () => { const g = {}; $('#gl').value.split('\n').forEach(l => { const k = l.indexOf('='); if (k > 0) g[l.slice(0, k).trim()] = l.slice(k + 1).trim(); });
    await api('glossary', { dir: dir(), glossary: g }); toast('บันทึกอภิธานศัพท์แล้ว'); };
  $('#play').onclick = async () => { toast((await api('install', { dir: dir(), play: true })).msg); detect(); };
  $('#inst').onclick = async () => { toast((await api('install', { dir: dir() })).msg); detect(); };
  $('#unin').onclick = async () => { toast((await api('uninstall', { dir: dir() })).msg); detect(); };
  $('#exp').onclick = async () => {
    await api('settings', { save: { translator_name: $('#tname').value.trim() } });
    const r = await api('export', { dir: dir() });
    if (!mock) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(r.mod, null, 1)], { type: 'application/json' })); a.download = r.filename; a.click(); }
    toast(`ส่งออกแล้ว ${r.mod.translated_lines}/${r.mod.total_lines} ข้อความ`);
  };
  $('#up').onclick = async () => {
    if (!Auth.user) return Auth.open(location.hash.slice(1));
    const b = $('#up'); b.disabled = true;
    try {
      const r = await api('export', { dir: dir() });
      const res = await Lib.upload(r.mod);
      if (!mock && res.from_others) await api('import', { dir: dir(), content: JSON.stringify(res.file) });
      const st = res.file.stats, done = st.fast + st.premium + st.human;
      $('#up-last').textContent = `อัพล่าสุด ${new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} · คลังมี ${done.toLocaleString()} / ${st.total.toLocaleString()} บรรทัด`;
      toast(`อัพแล้ว เพิ่มใหม่ ${res.added.toLocaleString()} บรรทัด` + (res.from_others ? ` · ได้งานคนอื่นกลับมา ${res.from_others.toLocaleString()} บรรทัด` : ''));
      await Lib.inject(); if (res.from_others) detect();
    } catch (e) { toast(e.message); }
    b.disabled = false;
  };
  $('#imp').onchange = async e => { const f = e.target.files[0]; if (!f) return; toast((await api('import', { dir: dir(), content: await f.text() })).msg); e.target.value = ''; detect(); };
  (async () => {
    const s = await api('settings');
    const om = s.backend !== 'api' ? (s.model || 'gemma3:4b') : 'gemma3:4b';
    if ([...$('#m-pick').options].some(o => o.value === om)) $('#m-pick').value = om; else { $('#m-pick').value = 'custom'; $('#m-ollama').value = om; $('#m-custom-l').classList.remove('hide'); }
    if (s.backend === 'api' && s.model) store.set('premiumModel', s.model);
    $('#base').value = s.base_url || ''; $('#key').value = s.api_key || ''; $('#tname').value = s.translator_name || '';
    const b = $(`#be [data-b="${s.backend || 'ollama'}"]`); if (b) b.click();
    olCheck();
    const last = mock ? 'C:\\Games\\Hero Quest' : store.get('lastDir');
    if (last) { $('#dir').value = last; detect().catch(() => {}); }
  })();
}

// ================================================================ auth (Google ผ่าน Supabase)
const Auth = {
  user: null, client: null, demo: true, after: null,
  async init() {
    const h = CAT.hub || {};
    if (h.supabase_url && h.supabase_anon_key) {
      try {
        await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
        this.client = window.supabase.createClient(h.supabase_url, h.supabase_anon_key);
        this.demo = false;
        const { data } = await this.client.auth.getSession(); this.set(data.session?.user);
        this.client.auth.onAuthStateChange((_e, s) => { this.set(s?.user); });
      } catch { this.demo = true; }
    }
    if (this.demo) this.set(store.get('demoUser'));
    $('#login-google').onclick = () => this.signIn();
    $('#login-cancel').onclick = () => $('#login').close();
  },
  set(u) {
    this.user = u ? { id: u.id, name: u.user_metadata?.full_name || u.name || u.email, email: u.email, avatar: u.user_metadata?.avatar_url || null } : null;
    this.render();
    if (this.user) Profiles.get(this.user.id).then(p => { if (p && this.user && p.user_id === this.user.id) {
      this.user.name = p.display_name || this.user.name; this.user.avatar = p.avatar_url || this.user.avatar; this.user.verified = p.verified; this.render(); } }).catch(() => {});
  },
  render() {
    const u = this.user;
    $('#auth').innerHTML = u
      ? `<a href="#account" class="linkbtn" aria-label="บัญชีของฉัน"><span class="avatar">${u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : esc((u.name || '?').slice(0, 1).toUpperCase())}</span><span class="label">${esc(u.name)}</span></a>`
      : `<button class="linkbtn" id="signin">${icon('log-in')}<span class="label">เข้าสู่ระบบ</span></button>`;
    if (!u) $('#signin').onclick = () => this.open();
  },
  open(after = null) {
    this.after = after;
    $('#login-text').textContent = this.demo
      ? 'โหมดตัวอย่าง: ยังไม่ได้เชื่อม Google จริง กดปุ่มด้านล่างเพื่อลองเข้าระบบด้วยบัญชีสมมติ'
      : 'ใช้บัญชี Google เพื่อยืนยันความเป็นเจ้าของผลงานแปล และตั้งค่าช่องทางรับเงินสนับสนุน';
    $('#login-google').textContent = this.demo ? 'ลองเข้าสู่ระบบ (บัญชีตัวอย่าง)' : 'เข้าสู่ระบบด้วย Google';
    $('#login').showModal();
  },
  async signIn() {
    if (!this.demo) {
      await this.client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname + '#' + (this.after || 'home') } });
      return;
    }
    const u = { id: 'demo', name: 'ผู้ใช้ตัวอย่าง', email: 'demo@example.com', user_metadata: {} };
    store.set('demoUser', u); this.set(u); $('#login').close();
    if (this.after) location.hash = this.after; else route();
  },
  async signOut() {
    if (this.client) await this.client.auth.signOut();
    store.set('demoUser', null); this.set(null); location.hash = 'home';
  },
  async loadRequest() {
    if (this.demo) return store.get('demoRequest');
    const { data } = await this.client.from('translator_requests').select('*').eq('user_id', this.user.id).order('created_at', { ascending: false }).limit(1);
    return data && data[0];
  },
  async saveRequest(r) {
    if (this.demo) { store.set('demoRequest', { ...r, status: 'pending' }); return; }
    const { error } = await this.client.from('translator_requests').insert({ ...r, user_id: this.user.id });
    if (error) throw new Error(error.message);
  },
};

async function viewAccount() {
  if (!Auth.user) { page(`<div class="empty" style="margin-top:64px"><b>ยังไม่ได้เข้าสู่ระบบ</b><button class="btn pri" id="li" style="margin-top:16px">เข้าสู่ระบบ</button></div>`);
    $('#li').onclick = () => Auth.open('account'); return; }
  const u = Auth.user;
  page(`<div class="empty" style="margin-top:64px;border:0">กำลังโหลด</div>`);
  const [prof0, req, rows] = await Promise.all([Profiles.get(u.id).catch(() => null), Auth.loadRequest().catch(() => null), Profiles.uploads({ user_id: u.id }).catch(() => [])]);
  const prof = prof0 || { display_name: u.name, avatar_url: u.avatar, verified: false };
  const games = Profiles.byGame(rows), total = games.reduce((a, g) => a + g.lines, 0);
  const status = !req ? '' : req.status === 'approved' ? 'ยืนยันตัวตนแล้ว' : req.status === 'rejected' ? 'ไม่ผ่าน ติดต่อแอดมิน' : 'รอทีมงานตรวจ';
  page(`<div class="acct">
    <aside class="panel who-card">${avatarHtml(prof)}
      <h2>${esc(prof.display_name)}${prof.verified ? `<span class="vb" title="ยืนยันตัวตนแล้ว">${icon('badge-check')}</span>` : ''}</h2>
      <div class="t3" style="font-size:13px">${esc(u.email || '')} · เห็นแค่คุณ</div>
      <span class="pill">${prof.verified ? 'ผู้แปลที่ยืนยันแล้ว' : 'ผู้ร่วมแปล'}</span>
      <dl class="kv" style="margin-top:20px"><dt>แปลไปแล้ว</dt><dd class="mono">${total.toLocaleString()} บรรทัด</dd><dt>เกม</dt><dd class="mono">${games.length}</dd><dt>อัพ</dt><dd class="mono">${rows.length} ครั้ง</dd></dl>
      ${Auth.demo ? '<p class="t3" style="font-size:12px;margin:16px 0 0">บัญชีตัวอย่าง ข้อมูลเก็บไว้ในเบราว์เซอร์นี้เท่านั้น</p>' : ''}
      <div class="actions"><a class="btn sec" href="#u-${encodeURIComponent(u.id)}">${icon('user')}ดูหน้าสาธารณะ</a><button class="btn quiet" id="so">${icon('log-out')}ออกจากระบบ</button></div>
    </aside>
    <div style="display:grid;gap:24px;min-width:0">
      <div class="panel">
        <div class="ptitle">โปรไฟล์ <span class="t3" style="font-size:12px;font-weight:400">· ทุกคนเห็นข้อมูลในส่วนนี้</span></div>
        <form id="pf" class="formgrid">
          <label class="f">ชื่อที่แสดง<input type="text" name="display_name" required maxlength="60" value="${esc(prof.display_name || '')}"></label>
          <label class="f">ลิงก์เพจหรือช่องของคุณ<input type="text" name="page_url" placeholder="https://" value="${esc(prof.page_url || '')}"></label>
          <label class="f full">แนะนำตัว<textarea name="bio" rows="3" maxlength="500" placeholder="แปลเกมแนวไหน ทีมไหน">${esc(prof.bio || '')}</textarea></label>
          <label class="f">พร้อมเพย์รับเงินสนับสนุน<input type="text" name="promptpay" inputmode="numeric" placeholder="เบอร์โทร เลขบัตร หรือ e-Wallet" value="${esc(prof.promptpay || '')}"></label>
          <p class="t3" style="font-size:12px;margin:28px 0 0">ปุ่มสนับสนุนบนหน้าของคุณจะเปิดหลังยืนยันตัวตนผู้แปลแล้ว เงินเข้าพร้อมเพย์นี้โดยตรง</p>
          <div class="full actions" style="margin-top:8px"><button class="btn pri" type="submit">บันทึกโปรไฟล์</button><span id="pmsg" class="t2" style="font-size:13px"></span></div>
        </form>
      </div>
      <div class="panel"><div class="ptitle">ผลงานของฉัน</div>${gameRows(games)}</div>
      <div class="panel">
        <div class="ptitle"><span>ยืนยันตัวตนผู้แปล</span>${status ? `<span class="pill" style="margin:0">${status}</span>` : ''}</div>
        <p class="t2" style="font-size:14px;margin:0 0 24px">มีเพจแปลเกมอยู่แล้ว ยืนยันว่าเป็นเจ้าของเพจ เพื่อรับป้ายยืนยัน ฝากไฟล์ในคลัง และเปิดปุ่มสนับสนุน ทีมงานจะทักไปที่เพจเพื่อยืนยันอีกครั้ง</p>
        <form id="rf" class="formgrid">
          <label class="f">ชื่อเพจหรือทีมแปล<input type="text" name="page_name" required value="${esc(req?.page_name || '')}"></label>
          <label class="f">ลิงก์เพจ<input type="text" name="page_url" required placeholder="https://" value="${esc(req?.page_url || prof.page_url || '')}"></label>
          <label class="f full">เกมที่แปล<textarea name="games" rows="3" placeholder="บรรทัดละเกม">${esc(req?.games || '')}</textarea></label>
          <div class="full actions" style="margin-top:8px"><button class="btn sec" type="submit">${req ? 'ส่งข้อมูลใหม่' : 'ส่งคำขอยืนยัน'}</button><span id="rmsg" class="t2" style="font-size:13px"></span></div>
        </form>
      </div>
    </div>
  </div>`);
  $('#so').onclick = () => Auth.signOut();
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.display_name = d.display_name.trim(); d.page_url = d.page_url.trim() || null; d.bio = d.bio.trim() || null;
    d.promptpay = d.promptpay.replace(/\D/g, '') || null;
    if (d.page_url && !/^https?:\/\//.test(d.page_url)) { $('#pmsg').textContent = 'ลิงก์ต้องขึ้นต้นด้วย https://'; return; }
    if (d.promptpay && ![10, 13, 15].includes(d.promptpay.length)) { $('#pmsg').textContent = 'พร้อมเพย์ต้องเป็น 10, 13 หรือ 15 หลัก'; return; }
    try { await Profiles.save(d); Auth.user.name = d.display_name; Auth.render(); toast('บันทึกโปรไฟล์แล้ว'); viewAccount(); }
    catch (err) { $('#pmsg').textContent = err.message; }
  };
  $('#rf').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    if (!/^https?:\/\//.test(d.page_url)) { $('#rmsg').textContent = 'ลิงก์เพจต้องขึ้นต้นด้วย https://'; return; }
    try { await Auth.saveRequest({ ...d, promptpay: prof.promptpay || '' }); viewAccount(); toast('ส่งคำขอแล้ว ทีมงานจะติดต่อกลับทางเพจ'); }
    catch (err) { $('#rmsg').textContent = err.message; }
  };
}

// ================================================================ toast
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);border-radius:10px;padding:12px 16px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);transition:opacity .2s var(--ease)';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 3500);
}

window.addEventListener('unhandledrejection', e => e.preventDefault());
boot();
